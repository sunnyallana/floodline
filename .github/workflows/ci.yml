name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (base + dev + geo; model extras are not needed for unit tests)
        # 3.12 installs the locked versions (reproducible); 3.11 resolves fresh, so upstream breakage shows up.
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            pip install -r requirements/lock-geo-dev.txt && pip install --no-deps -e .
          else
            pip install -e ".[dev,geo]"
          fi
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests (coverage must stay above the bar in pyproject.toml)
        run: pytest --cov=floodline --cov-report=term-missing
      - name: CLI smoke
        run: floodline --help

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and database-policy tests
        run: npm test
      - name: End-to-end (offline queue, service worker, uploads against a faked Supabase)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the CPU pipeline image from the lock file
        run: docker build -t floodline:ci .
      - name: Smoke test
        run: docker run --rm floodline:ci --help
