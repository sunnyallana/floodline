<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1417" />
    <meta name="description" content="Capture flood photos with location and send them to your coordination team when there is signal." />
    <link rel="icon" href="/field/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/field/icon-192.png" />
    <title>Floodline Field</title>
  </head>
  <body>
    <header class="bar">
      <a class="brand" href="#capture" aria-label="Floodline Field, capture">Floodline <span>Field</span></a>
      <span id="net" class="chip" role="status" aria-live="polite"></span>
      <a id="outbox-link" class="chip link" href="#outbox">Outbox <b id="pending">0</b></a>
    </header>
    <main id="view" tabindex="-1"></main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript>Floodline Field needs JavaScript to store photos while you are offline.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
